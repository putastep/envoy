static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          # Access log prints :authority so you can see which ring buffer handled each request
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format: "[%START_TIME%] host=%REQ(:AUTHORITY)% \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %RESPONSE_FLAGS% cache=%RESP(X-CACHE-STATUS)% upstream_ms=%DURATION%\n"
          route_config:
            name: local_route
            virtual_hosts:

            # ----------------------------------------------------------------
            # host-a  →  backend on port 8080
            # curl -H "Host: host-a" http://localhost:10000/...
            # Ring buffer for host-a: independent 2-entry ring buffer
            # ----------------------------------------------------------------
            - name: host_a
              domains: ["host-a", "host-a:10000"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: backend_a
                  timeout: 10s

            # ----------------------------------------------------------------
            # host-b  →  backend on port 8081
            # curl -H "Host: host-b" http://localhost:10000/...
            # Ring buffer for host-b: independent 2-entry ring buffer
            # ----------------------------------------------------------------
            - name: host_b
              domains: ["host-b", "host-b:10000"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: backend_b
                  timeout: 10s

            # ----------------------------------------------------------------
            # Default (no Host override) → backend_a / port 8080
            # ----------------------------------------------------------------
            - name: default
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: backend_a
                  timeout: 10s

          http_filters:
          - name: envoy.filters.http.cache_custom
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cache_custom.v3.CacheCustom
              # Each distinct :authority value gets its own ring buffer.
              #   host-a ring: [ slot0, slot1 ]   ← completely independent
              #   host-b ring: [ slot0, slot1 ]   ← completely independent
              max_entries_per_host: 2
              max_entry_size_bytes: 1024
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # Cluster A — port 8080 — "host-a"
  - name: backend_a
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: backend_a
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 8080

  # Cluster B — port 8081 — "host-b"
  - name: backend_b
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: backend_b
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 8082

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901